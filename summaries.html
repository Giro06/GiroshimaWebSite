<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex">
    <title>Summary Editor - Giroshima</title>
    <link rel="icon" type="image/svg+xml" href="favicon.svg">
    <link rel="stylesheet" href="css/style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <style>
        .sum-page { max-width: 900px; margin: 0 auto; padding: 120px 20px 80px; }
        .sum-header h1 { font-family: var(--font-display); font-size: 1.6rem; margin-bottom: 8px; }
        .sum-header p { color: var(--text-secondary); margin-bottom: 24px; }
        .sum-toolbar { display: flex; gap: 10px; flex-wrap: wrap; margin-bottom: 16px; align-items: center; }
        .sum-toolbar input[type="text"] {
            flex: 1; min-width: 200px; padding: 10px 14px; background: var(--bg-secondary);
            border: 1px solid var(--border); border-radius: var(--radius-sm); color: var(--text-primary);
        }
        .sum-toolbar select {
            padding: 10px 14px; background: var(--bg-secondary); border: 1px solid var(--border);
            border-radius: var(--radius-sm); color: var(--text-primary);
        }
        .sum-stats { color: var(--text-muted); font-size: 0.85rem; margin-bottom: 20px; }
        .sum-card {
            background: var(--bg-card); border: 1px solid var(--border); border-radius: var(--radius-lg);
            padding: 18px; margin-bottom: 16px;
        }
        .sum-card-head { display: flex; align-items: center; gap: 12px; margin-bottom: 12px; }
        .sum-card-head img { width: 44px; height: 44px; border-radius: 10px; background: var(--bg-secondary); }
        .sum-card-head .sum-title { font-weight: 600; }
        .sum-card-head .sum-meta { color: var(--text-muted); font-size: 0.78rem; }
        .sum-field { margin-bottom: 10px; }
        .sum-field label { display: block; font-size: 0.75rem; color: var(--text-secondary); margin-bottom: 4px; text-transform: uppercase; letter-spacing: 0.05em; }
        .sum-field textarea, .sum-field input[type="text"], .sum-field select {
            width: 100%; padding: 8px 12px; background: var(--bg-secondary); border: 1px solid var(--border);
            border-radius: var(--radius-sm); color: var(--text-primary); font-family: var(--font-body); font-size: 0.9rem;
            resize: vertical;
        }
        .sum-field textarea { min-height: 54px; }
        .sum-card-actions { display: flex; gap: 10px; align-items: center; margin-top: 8px; }
        .sum-save-btn {
            padding: 8px 20px; background: linear-gradient(135deg, #6bcb77, #3a9647); color: #fff;
            border: none; border-radius: var(--radius-sm); cursor: pointer; font-weight: 600;
        }
        .sum-save-btn:disabled { opacity: 0.6; cursor: default; }
        .sum-dirty { font-size: 0.78rem; color: var(--accent); display: none; }
        .sum-card.dirty .sum-dirty { display: inline; }
        .sum-load-more { display: block; margin: 24px auto; }
        .sum-login { max-width: 400px; margin: 0 auto; }
        .sum-note { font-size: 0.8rem; color: var(--text-muted); margin-top: 12px; line-height: 1.5; }
        .sum-logout { background: linear-gradient(135deg, #444, #666) !important; }
    </style>
</head>
<body>
    <canvas id="particles-canvas"></canvas>

    <nav class="navbar">
        <div class="nav-container">
            <a href="index.html" class="logo">
                <span class="logo-icon">&#9670;</span>
                <span class="logo-text">GIROSHIMA</span>
            </a>
            <ul class="nav-links">
                <li><a href="editor.html" class="nav-link">Editor</a></li>
                <li><a href="summaries.html" class="nav-link active">Summaries</a></li>
            </ul>
        </div>
    </nav>

    <main class="sum-page">
        <!-- Login -->
        <div class="sum-login login-section" id="sum-login">
            <h2>Store Scope Login</h2>
            <p style="color:var(--text-secondary); font-size:0.85rem; margin-bottom:16px;">
                Sign in with your Store Scope account to edit game summaries.
                Reads are public; writes are enforced by Supabase RLS.
            </p>
            <div class="form-group">
                <label for="ss-email">Email</label>
                <input type="email" id="ss-email" placeholder="you@example.com" autocomplete="username">
            </div>
            <div class="form-group">
                <label for="ss-password">Password</label>
                <input type="password" id="ss-password" placeholder="Store Scope password" autocomplete="current-password">
            </div>
            <button type="button" class="form-btn" id="ss-login-btn">Login</button>
        </div>

        <!-- Editor -->
        <div id="sum-editor" style="display:none;">
            <div class="sum-header" style="display:flex; justify-content:space-between; align-items:flex-start; gap:16px;">
                <div>
                    <h1>Game Summary Editor</h1>
                    <p>Edit gameplay summaries, win/fail states for tracked games.</p>
                </div>
                <button type="button" class="form-btn sum-logout" id="ss-logout-btn" style="flex:0 0 auto; padding:8px 18px;">Logout</button>
            </div>

            <div class="sum-toolbar">
                <input type="text" id="sum-search" placeholder="Search by game name...">
                <select id="sum-filter">
                    <option value="all">All games</option>
                    <option value="has-summary">Has summary</option>
                    <option value="no-summary">Missing summary</option>
                    <option value="unknown-fail">fail_type = unknown</option>
                    <option value="notstated-fail">fail_state "Not stated"</option>
                </select>
            </div>
            <div class="sum-stats" id="sum-stats">Loading stats...</div>

            <div id="sum-list"></div>
            <button type="button" class="form-btn sum-load-more" id="sum-load-more" style="display:none;">Load More</button>
        </div>
    </main>

    <div class="toast" id="toast"></div>

    <script src="js/particles.js"></script>
    <script src="js/summaries.js"></script>
</body>
</html>
